name: Keep Render app awake

on:
  schedule:
    # Every 10 minutes. Render's free tier spins down after ~15 minutes
    # of inactivity, so this keeps it from ever going to sleep.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: curl -fsS https://natural-language-sql-generator.onrender.com/
